[package]
name = "simlite"
version = "0.1.0"
edition = "2024"
description = "Viewer leve de CFTV Intelbras (RTSP live + playback do DVR)"
license = "MIT"

[lib]
name = "simlite"
path = "src/lib.rs"

[[bin]]
name = "simlite"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6"
keyring = { version = "3", features = ["windows-native"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
digest_auth = "0.3"
zeroize = { version = "1", features = ["zeroize_derive"] }
slint = "1.14"

[build-dependencies]
slint-build = "1.14"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 16
opt-level = 3
strip = true
